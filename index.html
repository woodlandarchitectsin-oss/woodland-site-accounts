<script>
(function () {
  function show(msg) {
    try {
      var d = document.getElementById('wsa-err');
      if (!d) {
        d = document.createElement('div');
        d.id = 'wsa-err';
        d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b3261e;color:#fff;font:13px/1.4 monospace;padding:10px 12px;white-space:pre-wrap;max-height:50vh;overflow:auto';
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += msg + '\n';
    } catch (e) { }
  }
  window.onerror = function (m, src, line) { show('Error: ' + m + (line ? ' (line ' + line + ')' : '')); };
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev && ev.reason;
    show('Error: ' + ((r && r.message) || r));
  });
  window.__wsaShowError = show;
})();
</script>

<style>
:root {
  --bg: #f1f4f8; --surface: #ffffff; --ink: #171b21; --muted: #5a6573; --line: #dbe1ea;
  --accent: #2b5c94; --accent-ink: #ffffff; --accent-soft: #dde8f5;
  --red: #b3261e; --red-soft: #f8e3e1; --green: #2b7a4b; --green-soft: #dcefe3;
  --amber: #9a6200; --amber-soft: #f6ecd8; --backdrop: rgba(20, 18, 15, .5);
  --f-text: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --f-head: 'Familjen Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #161a20; --ink: #e3e7ec; --muted: #a2adba; --line: #29303a;
    --accent: #8db5e6; --accent-ink: #0b1626; --accent-soft: #1b2a3d;
    --red: #f0857c; --red-soft: #3a1d1b; --green: #7fcf9d; --green-soft: #173022;
    --amber: #e2b35c; --amber-soft: #352a14; --backdrop: rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 15px; line-height: 1.45; }
body.noscroll { overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--f-head); margin: 0; font-weight: 600; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.err { color: var(--red); font-size: 14px; min-height: 0; }
.err:empty { display: none; }

#boot { padding: 60px 20px; text-align: center; color: var(--muted); }
#gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
.gate-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.gate-card h1 { font-size: 26px; }

.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top)); min-height: 56px; }
.brand { font-family: var(--f-head); font-weight: 700; font-size: 19px; color: var(--accent); white-space: nowrap; }
.who { margin-left: auto; text-align: right; line-height: 1.2; min-width: 0; }
.who b { display: block; font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.status.warn .dot { background: #d29a1f; }
.status.bad .dot { background: var(--red); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
.tab { background: none; border: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
.tab.on { color: var(--accent); font-weight: 600; }
.tab svg { width: 24px; height: 24px; }
main { max-width: 1000px; margin: 0 auto; padding: 14px 16px 96px; }
#netbanner { background: var(--amber-soft); color: var(--amber); padding: 10px 16px; font-size: 14px; border-bottom: 1px solid var(--line); }

.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.card h2 { font-size: 17px; margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.btn { min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 68px; font-size: 18px; font-family: var(--f-head); border-color: transparent; }
.btn.exp { background: var(--red-soft); color: var(--red); }
.btn.rec { background: var(--green-soft); color: var(--green); }
.btn.sm { min-height: 44px; font-weight: 500; }
.btn svg { width: 20px; height: 20px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 6px; }
.icon-btn { width: 44px; height: 44px; border-radius: 6px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 22px; height: 22px; }
.bigbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.smallbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; font-weight: 500; flex: 0 0 auto; }
.chip.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { min-height: 44px; border: 0; background: transparent; border-radius: 5px; font-weight: 500; font-size: 14px; padding: 0 2px; }
.seg button.sel { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.seg button.sel.t-exp { color: var(--red); }
.seg button.sel.t-rec { color: var(--green); }

label.fl { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.in, select.in, textarea.in { width: 100%; min-height: 48px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; font-size: 16px; }
textarea.in { min-height: 76px; resize: vertical; }
.in:focus-visible, .btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.amount-wrap { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px 14px; }
.amount-wrap span { font-family: var(--f-mono); font-size: 30px; color: var(--muted); }
.amount-wrap input { border: 0; background: transparent; outline: 0; width: 100%; font-family: var(--f-mono); font-size: 36px; font-weight: 500; min-height: 62px; padding: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

.stat { background: var(--bg); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--f-mono); font-size: 18px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 6px; padding: 12px 14px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; width: 100%; text-align: left; min-height: 44px; }

.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.item { display: flex; gap: 10px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); min-height: 56px; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .a { text-align: right; font-family: var(--f-mono); font-weight: 500; white-space: nowrap; }
.item .a small { display: block; font-family: var(--f-text); font-size: 11.5px; font-weight: 500; }
.day { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 10px; background: var(--bg); color: var(--muted); font-weight: 500; }
.badge.warn { background: var(--amber-soft); color: var(--amber); }
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.bad { background: var(--red-soft); color: var(--red); }
.bar { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.hist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; font-size: 13px; }
.hist div { border-left: 2px solid var(--line); padding-left: 10px; }
.billimg { width: 100%; max-height: 260px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); display: block; }
.empty { text-align: center; color: var(--muted); padding: 22px 8px; }
.filters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.filters .grid3 select { min-width: 0; font-size: 14px; padding: 10px 4px; }

.sheet-back { position: fixed; inset: 0; background: var(--backdrop); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-height: 94vh; display: flex; flex-direction: column; border-radius: 10px 20px 0 0; border: 1px solid var(--line); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 18px; border-bottom: 1px solid var(--line); }
.sheet-title { font-family: var(--f-head); font-weight: 600; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow: auto; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
.dialog-back { z-index: 70; align-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 10px; padding: 20px; width: 100%; max-width: 380px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; border: 1px solid var(--line); }
#toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 6px; font-size: 14px; max-width: 92vw; text-align: center; }

@media (min-width: 820px) {
  .top { position: fixed; left: 0; top: 0; bottom: 0; width: 200px; flex-direction: column; align-items: stretch; gap: 0; padding: 18px 0 14px; border-bottom: 0; border-right: 1px solid var(--line); }
  .brand { padding: 0 18px 16px; margin-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .brand::after { content: "Site Accounts"; display: block; font-family: var(--f-text); font-weight: 400; font-size: 11px; letter-spacing: .12em; color: var(--muted); }
  .tabs { position: static; border: 0; background: transparent; display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
  .tab { flex-direction: row; justify-content: flex-start; min-height: 44px; padding: 0 10px; font-size: 14px; font-weight: 500; gap: 10px; border-radius: 6px; }
  .tab svg { width: 18px; height: 18px; }
  .tab:hover { background: var(--bg); color: var(--ink); }
  .tab.on { background: var(--accent-soft); font-weight: 500; }
  .who { margin: auto 0 0; text-align: left; padding: 12px 18px 0; border-top: 1px solid var(--line); }
  .who b { max-width: 164px; }
  #app > main, #netbanner { margin-left: 200px; }
  main { max-width: 1180px; margin-left: 200px; margin-right: 0; padding: 20px 28px 40px; }
  .sheet-back { align-items: center; }
  .sheet { max-width: 560px; border-radius: 10px; max-height: 90vh; }
  .sheet.wide { max-width: 760px; }
  #toast { bottom: 28px; }
  .desk2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
}
@media (max-width: 520px) {
  .mstats { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .mstats .stat { display: flex; justify-content: space-between; align-items: baseline; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .tab { transition: background-color .12s, color .12s; }
}
</style>

  loadAllData(true).then(function () { if (S.isAdmin && !S.sheetUrl) fetchSheetUrl(); });
  if (S.queue.length) pump();
  if (!timersOn) {
    timersOn = true;
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { pump(); pollSoon(); } });
    window.addEventListener('focus', function () { pump(); pollSoon(); });
    window.addEventListener('online', function () { S.online = true; S.syncError = false; S.netFail = 0; renderStatus(); pump(); pollSoon(); });
    window.addEventListener('offline', function () { S.online = false; renderStatus(); });
  }
}
function fetchSheetUrl() {
  callApi('hello', [auth(), '']).then(function (r) { if (r.ok && r.sheetUrl) { S.sheetUrl = r.sheetUrl; scheduleRender(); } });
}
function boot() {
  S.pin = store.get('wsa_pin') || '';
  S.name = store.get('wsa_name') || '';
  S.admin = store.get('wsa_admin') || '';
  S.isAdmin = !!S.admin;
  S.queue = jget('wsa_q') || [];
  S.failed = jget('wsa_failed') || [];
  window.__wsa = { S: S, poll: poll, pump: pump, loadAllData: loadAllData, renderNow: renderNow, agg: agg };
  if (!S.pin) { showPinScreen(''); return; }
  if (!S.name) { var c = jget('wsa_cache'); if (c) S.people = c.people || []; showNameScreen(); return; }
  startApp();
}
boot();
</script>
